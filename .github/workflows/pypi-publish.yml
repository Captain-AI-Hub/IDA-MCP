name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write  # PyPI trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
        # Uses the PYPI_API_TOKEN secret when set; otherwise falls back to
        # trusted publishing (register owner=Captain-AI-Hub, repo=IDA-MCP,
        # workflow pypi-publish.yml, project idamcp-hub). skip-existing keeps
        # re-runs of the same tag green.
