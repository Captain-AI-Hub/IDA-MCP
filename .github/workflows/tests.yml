name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        # IDA/idalib is unavailable on CI runners: backend tool tests skip,
        # unit tests (installer, lifecycle matching, config, registry) gate.
        run: |
          mkdir -p .artifacts/pytest_tmp
          python -m pytest -q
