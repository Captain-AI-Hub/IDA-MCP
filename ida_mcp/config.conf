# IDA-MCP 配置文件
# ==================
# MCP 传输仅支持 stdio（uvx idamcp stdio）。
# 实例桥固定监听 127.0.0.1（端口自 13337 向上递增），插件加载后自动启动，均无需配置。
# 配置读取顺序：内置默认 → 包内 config.conf → 用户级
# <IDAUSR>/ida-mcp/config.conf → 环境变量 IDA_MCP_CONFIG_* → HCLI 设置

# ==================
# IDA / 无头启动
# ==================
ida_path = "" # IDA 可执行文件路径（GUI 启动用）；留空时 GUI 启动会报错提示
ida_python = "" # IDA Python 可执行文件路径；留空自动检测并回写缓存
idalib_python = "" # 已激活 idalib 的 Python（无头 worker）；留空时自动探测并缓存到用户级配置

# ==================
# 通用配置
# ==================
request_timeout = 30 # 请求超时时间（秒）
debug = false # 是否启用调试日志
