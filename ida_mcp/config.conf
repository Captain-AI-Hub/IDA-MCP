# IDA-MCP 配置文件
# ==================
# HTTP 是唯一支持的 MCP 连接方式

# ==================
# 运行时开关
# ==================
enable_gateway = true # 是否启用网关和 MCP 代理（供 MCP 客户端通过 URL 连接）
enable_unsafe = false # 是否启用 unsafe 工具（py_eval、调试器相关工具）
wsl_path_bridge = false # 仅在“LLM/客户端工作在 WSL，但 IDA/Python 在 Windows 宿主机”时开启；
						# 开启后 open_in_ida 会桥接 Windows/WSL 路径

# ==================
# 网关 HTTP 配置 (自动启动，客户端只需填写 URL)
# ==================
http_host = "127.0.0.1" # HTTP 网关监听地址；127.0.0.1 仅本机，0.0.0.0 所有接口
http_port = 11338 # 网关端口
http_path = "/mcp" # MCP 端点路径
mcp_protocol_version = "2026-07-28" # 新版 MCP 协议版本
mcp_sessionless = true # 使用无 session HTTP；避免 Mcp-Session-Id 失效
mcp_json_response = true # 优先返回 application/json
mcp_legacy_protocol = true # 兼容旧 initialize/session 客户端；设为 false 则拒绝握手时代请求，仅接受 2026-07-28
gateway_token = "" # 远程访问所需共享 token；127.0.0.1/::1 本机访问无需 token

# ==================
# IDA 实例配置
# ==================
ida_default_port = 10000 # IDA 实例 MCP 端口起始值
ida_host = "127.0.0.1" # IDA 实例 MCP 监听地址；默认仅监听本机
ida_path = "" # IDA 可执行文件路径；按本机环境配置
ida_python = "" # IDA Python 可执行文件路径；按本机环境配置
open_in_ida_bundle_dir = "" # 可选。配置后 open_in_ida 会把目标文件复制到该目录下的时间戳目录；
							# 若存在匹配的 .i64/.idb 也会一起复制并优先打开数据库。未配置时直接打开原始路径
open_in_ida_autonomous = true # 是否默认让 open_in_ida 追加 -A
auto_start = false # 插件加载后是否默认自动启动实例服务
server_name = "IDA-MCP" # MCP 服务名


# ==================
# 通用配置
# ==================
request_timeout = 30 # 请求超时时间（秒）
debug = false # 是否启用调试日志
