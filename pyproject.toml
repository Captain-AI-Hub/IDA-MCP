[project]
name = "idamcp-hub"
version = "0.10.0"
description = "IDA Pro MCP server: stdio transport, headless idalib workers, and official IDAPython reference."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.0b1,<5",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "colorama>=0.4,<1",
]

[project.urls]
Repository = "https://github.com/Captain-AI-Hub/IDA-MCP"

[project.scripts]
idamcp-hub = "ida_mcp.command:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ida_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "ida_mcp",
    "scripts",
    "README.md",
    "API.md",
]
